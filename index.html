<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="XI TJKT-1: the digital home of our class: its people, its structure, and its memories." />
    <!-- Both variants let the browser pick before scripts run; the script below then pins the chosen theme. -->
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />
    <title>XI TJKT-1</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem('tjkt:theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          var color = theme === 'dark' ? '#09090B' : '#FAFAFA';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            if (i === 0) {
              metas[i].removeAttribute('media');
              metas[i].setAttribute('content', color);
            } else {
              metas[i].parentNode.removeChild(metas[i]);
            }
          }
          var accent = localStorage.getItem('tjkt:accent');
          if (accent) document.documentElement.dataset.accent = accent;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
